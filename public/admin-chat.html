<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="robots" content="noindex,nofollow"/>
<title>Chat Inbox · AutoVINReveal</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,'Segoe UI',sans-serif;background:#f1f5f9;color:#0f172a;height:100vh;height:100dvh;display:flex;flex-direction:column}
  header{background:#1e3a8a;color:#fff;padding:12px 18px;display:flex;align-items:center;justify-content:space-between}
  header h1{font-size:15px;font-weight:800}
  header a{color:#bfdbfe;font-size:12px;text-decoration:none}
  #login{margin:auto;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:28px;max-width:340px;width:100%;text-align:center}
  #login input{width:100%;padding:10px 12px;border:1px solid #cbd5e1;border-radius:8px;margin:8px 0;font-size:14px}
  .btn{background:#2563eb;color:#fff;border:none;border-radius:8px;padding:10px 16px;font-weight:700;cursor:pointer;font-size:13px}
  .btn:hover{background:#1d4ed8}
  #app{flex:1;display:none;overflow:hidden}
  #app.on{display:flex}
  #list{width:300px;border-right:1px solid #e2e8f0;background:#fff;overflow-y:auto;flex-shrink:0}
  .conv{padding:12px 14px;border-bottom:1px solid #f1f5f9;cursor:pointer}
  .conv:hover{background:#f8fafc}
  .conv.sel{background:#eff6ff}
  .conv .top{display:flex;justify-content:space-between;align-items:center;gap:8px}
  .conv .who{font-weight:700;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .conv .t{font-size:10px;color:#94a3b8;margin-top:3px}
  .conv.unread{background:#f0f7ff;box-shadow:inset 3px 0 0 #2563eb}
  .conv.unread:hover{background:#e6f1ff}
  .unread-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#2563eb;margin-right:6px;vertical-align:middle;flex-shrink:0}
  .badge{font-size:9px;font-weight:800;padding:2px 7px;border-radius:999px;text-transform:uppercase;letter-spacing:.04em;flex-shrink:0}
  .b-flag{background:#fee2e2;color:#b91c1c}
  .b-human{background:#dcfce7;color:#166534}
  .b-ai{background:#e2e8f0;color:#475569}
  #right{flex:1;display:flex;flex-direction:column;background:#f8fafc}
  #bar{padding:10px 16px;border-bottom:1px solid #e2e8f0;background:#fff;display:flex;align-items:center;justify-content:space-between;gap:10px}
  #bar .who{font-weight:700;font-size:13px}
  #msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px}
  .m{max-width:72%;padding:9px 12px;border-radius:12px;font-size:13px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .m-user{background:#fff;border:1px solid #e2e8f0;align-self:flex-start;border-bottom-left-radius:4px}
  .m-assistant{background:#eef2ff;color:#3730a3;align-self:flex-start;border-bottom-left-radius:4px}
  .m-owner{background:#2563eb;color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .m .lbl{font-size:9px;font-weight:800;opacity:.6;text-transform:uppercase;margin-bottom:2px}
  #composer{border-top:1px solid #e2e8f0;background:#fff;padding:10px;display:flex;gap:8px;align-items:flex-end}
  #composer textarea{flex:1;border:1px solid #cbd5e1;border-radius:8px;padding:9px 12px;font-size:13px;resize:none;font-family:inherit;max-height:120px}
  .empty{margin:auto;color:#94a3b8;font-size:13px}
  .toggle{font-size:12px;font-weight:700;border:1px solid #cbd5e1;background:#fff;border-radius:8px;padding:6px 12px;cursor:pointer}
  #backBtn{display:none;background:none;border:none;color:inherit;font-size:22px;line-height:1;cursor:pointer;padding:0 8px 0 0}
  @media(max-width:700px){
    #list{width:100%}
    #right{display:none}
    body.conv-open #list{display:none}
    body.conv-open #right{display:flex}
    #backBtn{display:inline-flex;align-items:center}
  }
</style>
</head>
<body>
<header>
  <h1>AutoVINReveal · Chat Inbox</h1>
  <a href="/">← Site</a>
</header>

<div id="login">
  <div style="font-weight:800;font-size:16px;margin-bottom:4px">Owner sign-in</div>
  <div style="font-size:12px;color:#64748b">Only the site owner can view live chats.</div>
  <input id="email" type="email" placeholder="Owner email" autocomplete="username"/>
  <input id="pw" type="password" placeholder="Password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"/>
  <button class="btn" onclick="doLogin()">Sign in</button>
  <div id="loginErr" style="color:#dc2626;font-size:12px;margin-top:8px;display:none"></div>
</div>

<div id="app">
  <div id="list"></div>
  <div id="right"><div class="empty">Select a conversation</div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL  = "https://vvajqnljwvhjgdtxqzfl.supabase.co";
const SB_ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZ2YWpxbmxqd3ZoamdkdHhxemZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NTk1NTg5NjIsImV4cCI6MjA3NTEzNDk2Mn0.Q4g5Slr3mpHrATgh03sSQ4gBVlpwtIZ8ioSmCa2GFv4";
const sb = window.supabase.createClient(SB_URL, SB_ANON);

const $ = id => document.getElementById(id);
let selId = null, listTimer = null, msgTimer = null, curMode = 'ai';

async function api(path, opts) {
  const { data } = await sb.auth.getSession();
  const token = data.session?.access_token || null;
  const o = Object.assign({ headers: { 'Content-Type': 'application/json' } }, opts);
  if (token) o.headers['Authorization'] = 'Bearer ' + token;
  return fetch(path, o);
}
function escapeHtml(s){ return String(s).replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function fmtTime(iso){ try { return new Date(iso).toLocaleString(); } catch { return ''; } }
function showLogin(msg){ $('login').style.display='block'; $('app').classList.remove('on'); if (listTimer) clearInterval(listTimer); if (msg){ $('loginErr').textContent=msg; $('loginErr').style.display='block'; } }

async function doLogin() {
  $('loginErr').style.display='none';
  const email = $('email').value.trim(), password = $('pw').value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { $('loginErr').textContent = error.message; $('loginErr').style.display='block'; return; }
  start();
}

async function start() {
  const { data } = await sb.auth.getSession();
  if (!data.session) { showLogin(); return; }
  const r = await api('/api/admin/chats');
  if (r.status === 403) { showLogin('This account is not the owner.'); return; }
  if (!r.ok) { showLogin(); return; }
  $('login').style.display='none'; $('app').classList.add('on');
  loadList();
  if (listTimer) clearInterval(listTimer);
  listTimer = setInterval(loadList, 5000);
}

async function loadList() {
  const r = await api('/api/admin/chats');
  if (!r.ok) return;
  const { conversations = [] } = await r.json();
  const el = $('list');
  if (!conversations.length) { el.innerHTML = '<div class="empty" style="padding:20px">No conversations yet</div>'; return; }
  el.innerHTML = conversations.map(c => {
    const badge = c.flagged ? '<span class="badge b-flag">needs you</span>'
      : (c.mode==='human' ? '<span class="badge b-human">live</span>' : '<span class="badge b-ai">ai</span>');
    const unread = c.id!==selId && c.last_message_at &&
      (!c.owner_read_at || new Date(c.last_message_at) > new Date(c.owner_read_at));
    const dot = unread ? '<span class="unread-dot" title="New messages"></span>' : '';
    return `<div class="conv ${c.id===selId?'sel':''} ${unread?'unread':''}" onclick="openConv('${c.id}')">
      <div class="top"><span class="who">${dot}${escapeHtml(c.visitor_email || 'Guest visitor')}</span>${badge}</div>
      <div class="t">${fmtTime(c.last_message_at)}</div>
    </div>`;
  }).join('');
}

async function openConv(id) {
  selId = id;
  document.body.classList.add('conv-open');
  $('right').innerHTML = `
    <div id="bar">
      <button id="backBtn" onclick="backToList()" aria-label="Back">←</button>
      <span class="who" id="barWho" style="flex:1"></span>
      <button class="toggle" id="modeBtn" onclick="toggleMode()"></button>
    </div>
    <div id="msgs"></div>
    <div id="composer">
      <div id="replyImgPreview" style="display:none;position:relative;flex-shrink:0">
        <img id="replyImgThumb" alt="" style="height:44px;border-radius:8px;display:block"/>
        <button type="button" onclick="clearReplyImage()" aria-label="Remove" style="position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;border:none;cursor:pointer;font-size:12px;line-height:1">×</button>
      </div>
      <input type="file" id="replyFile" accept="image/*" style="display:none" onchange="onReplyFile(this)">
      <button type="button" class="toggle" style="padding:8px 10px" onclick="document.getElementById('replyFile').click()" aria-label="Attach image" title="Attach image">🖼️</button>
      <textarea id="reply" rows="1" placeholder="Type a reply… (sending takes over the chat)"
        onpaste="onReplyPaste(event)"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendReply();}"></textarea>
      <button class="btn" onclick="sendReply()">Send</button>
    </div>`;
  loadMsgs(true);
  if (msgTimer) clearInterval(msgTimer);
  msgTimer = setInterval(() => loadMsgs(false), 4000);
  loadList();
}

async function loadMsgs(forceScroll) {
  if (!selId) return;
  const r = await api('/api/admin/chats/' + selId);
  if (!r.ok) return;
  const { conversation, messages = [] } = await r.json();
  curMode = conversation.mode;
  $('barWho').textContent = conversation.visitor_email || 'Guest visitor';
  $('modeBtn').textContent = curMode === 'human' ? 'Hand back to AI' : 'Take over';
  const box = $('msgs');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 120;
  box.innerHTML = messages.map(m => {
    const cls = m.role==='owner' ? 'm-owner' : (m.role==='assistant' ? 'm-assistant' : 'm-user');
    const lbl = m.role==='owner' ? 'You' : (m.role==='assistant' ? 'AI' : 'Visitor');
    const txt = m.content ? escapeHtml(m.content) : '';
    const img = m.image ? `<img src="${escapeHtml(m.image)}" alt="attachment" style="max-width:220px;max-height:240px;border-radius:8px;margin-top:${txt?'6px':'0'};display:block;cursor:zoom-in" onclick="window.open(this.src,'_blank')"/>` : '';
    return `<div class="m ${cls}"><div class="lbl">${lbl}</div>${txt}${img}</div>`;
  }).join('');
  if (forceScroll || atBottom) box.scrollTop = box.scrollHeight;
}

// ---- Image attachment (mirrors the visitor widget: downscale to JPEG, ≤2MB data URL) ----
let replyImage = null;
function onReplyFile(input) { const f = input.files && input.files[0]; if (f) attachReplyImage(f); input.value = ''; }
function onReplyPaste(e) {
  const items = (e.clipboardData && e.clipboardData.items) || [];
  for (const it of items) { if (it.type && it.type.indexOf('image') === 0) { const f = it.getAsFile(); if (f) { attachReplyImage(f); e.preventDefault(); return; } } }
}
function attachReplyImage(file) {
  if (!/^image\//.test(file.type)) { alert('Only images can be attached.'); return; }
  if (file.size > 25 * 1024 * 1024) { alert('That image is too big.'); return; }
  const reader = new FileReader();
  reader.onload = () => {
    const im = new Image();
    const show = () => { const p = $('replyImgPreview'); if (p && replyImage) { $('replyImgThumb').src = replyImage; p.style.display = 'block'; } };
    im.onload = () => {
      try {
        const MAXD = 1400, scale = Math.min(1, MAXD / Math.max(im.width, im.height));
        const c = document.createElement('canvas');
        c.width = Math.round(im.width * scale); c.height = Math.round(im.height * scale);
        c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
        replyImage = c.toDataURL('image/jpeg', 0.82);
      } catch (e) { replyImage = reader.result; }
      if (replyImage.length > 1900000) { replyImage = null; alert('Image is too large even after compression.'); return; }
      show();
    };
    im.onerror = () => { replyImage = reader.result.length > 1900000 ? null : reader.result; if (!replyImage) alert('Image is too large.'); show(); };
    im.src = reader.result;
  };
  reader.readAsDataURL(file);
}
function clearReplyImage() { replyImage = null; const p = $('replyImgPreview'); if (p) { p.style.display = 'none'; $('replyImgThumb').src = ''; } }

async function sendReply() {
  const ta = $('reply'); const content = (ta.value || '').trim(); const image = replyImage;
  if ((!content && !image) || !selId) return;
  ta.value = '';
  clearReplyImage();
  await api('/api/admin/chats/' + selId + '/reply', { method:'POST', body: JSON.stringify({ content, image }) });
  loadMsgs(true); loadList();
}

async function toggleMode() {
  if (!selId) return;
  const mode = curMode === 'human' ? 'ai' : 'human';
  await api('/api/admin/chats/' + selId + '/mode', { method:'POST', body: JSON.stringify({ mode }) });
  loadMsgs(false); loadList();
}

function backToList() {
  document.body.classList.remove('conv-open');
  selId = null;
  if (msgTimer) clearInterval(msgTimer);
  loadList();
}

start();
</script>
</body>
</html>
